version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: les-ptits-boursiers-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: les_ptits_boursiers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - les-ptits-boursiers-network

  # Market Service (Development mode with hot reload)
  market-service:
    build:
      context: ./backend/services/market-service
      dockerfile: Dockerfile
      target: builder
    container_name: market-service-dev
    environment:
      PORT: 3002
      NODE_ENV: development
    ports:
      - "3002:3002"
    volumes:
      - ./backend/services/market-service/src:/app/src
      - /app/node_modules
    command: npm run start:dev
    networks:
      - les-ptits-boursiers-network

  # Portfolio Service (Development mode with hot reload)
  portfolio-service:
    build:
      context: ./backend/services/portfolio-service
      dockerfile: Dockerfile
      target: builder
    container_name: portfolio-service-dev
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: les_ptits_boursiers
      NODE_ENV: development
    ports:
      - "3003:3003"
    volumes:
      - ./backend/services/portfolio-service/src:/app/src
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      - postgres
    networks:
      - les-ptits-boursiers-network

  # API Gateway (Development mode with hot reload)
  api-gateway:
    build:
      context: ./backend/services/api-gateway
      dockerfile: Dockerfile
      target: builder
    container_name: api-gateway-dev
    environment:
      PORT: 3001
      MARKET_SERVICE_URL: http://market-service:3002
      PORTFOLIO_SERVICE_URL: http://portfolio-service:3003
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./backend/services/api-gateway/src:/app/src
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      - market-service
      - portfolio-service
    networks:
      - les-ptits-boursiers-network

networks:
  les-ptits-boursiers-network:
    driver: bridge

volumes:
  postgres_data_dev:
